stages:
  - version

auto_version:
  stage: version
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash git
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@local"
    - git fetch --unshallow || true
    - git fetch --tags || true
  script:
    - ./scripts/bump_version.sh
    - git push "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:main
    - git push "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" --tags
