name: Autenticação — recusas do sandbox
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sandbox-refusal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Verificar dependências
        run: |
          python3 --version
          php --version
          pwsh --version
      - name: Verificar diagnóstico sanitizado
        run: |
          python3 -B tests/auth/rei124-safe-diagnostics.test.py
          python3 -B tests/auth/rei124-safe-failure-runner.test.py
          python3 -B tests/auth/rei124-ci-cleanup-check.test.py
      - name: Verificar recusa dos entrypoints sem sandbox
        run: python3 -B tests/auth/sandbox-guard-rejection.test.py
      - name: Verificar recusa de daemon remoto
        run: python3 -B tests/auth/rei93-daemon-refusal.test.py
      - name: Verificar falhas de limpeza sem Docker
        run: pwsh -NoProfile -File tests/auth/rei93-cleanup-failure.test.ps1
      - name: Verificar resposta perdida na criação
        run: python3 -B tests/auth/rei93-lost-create-runner.test.py
      - name: Verificar topologia com objetos sinteticos
        run: pwsh -NoProfile -File tests/auth/docker-topology-validation.test.ps1
      - name: Verificar topologia com navegador sintetico
        run: pwsh -NoProfile -File tests/auth/rei73-browser-topology.test.ps1
