name: Deploy PROD (main -> ios1vcrime.com.br)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      debug:
        description: "Diagnóstico extra (SSH -vvv, rsync -vv, set -x no sync)"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      DEPLOY_DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.debug || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar DEPLOY_HOST (trim + DNS no runner)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: bash .github/scripts/deploy-host-prepare.sh

      - name: Preflight (secrets obrigatórios)
        env:
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_TARGET_PATH: ${{ secrets.PROD_PATH }}
        run: bash .github/scripts/deploy-preflight.sh

      - name: Setup SSH (decode + validar chave + keyscan)
        env:
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_KEY_B64 }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
        run: bash .github/scripts/deploy-ssh-setup.sh

      - name: SSH sanity check
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
        run: |
          set -e
          EXTRA=()
          if [ "${DEPLOY_DEBUG}" = "true" ]; then
            EXTRA=(-vvv)
            echo "::notice::DEPLOY_DEBUG: SSH com -vvv (saída longa nos logs)."
          fi
          ssh "${EXTRA[@]}" -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o PasswordAuthentication=no \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo SSH_OK && whoami && pwd"

      - name: Sync files to server (PROD)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          set -e
          RSYNC_EXTRA=()
          if [ "${DEPLOY_DEBUG}" = "true" ]; then
            set -x
            RSYNC_EXTRA=(-vv)
          fi
          rsync "${RSYNC_EXTRA[@]}" -az \
            --no-times --omit-dir-times \
            --no-perms --no-owner --no-group \
            --inplace \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude "storage/" \
            --exclude "docs/" \
            --exclude "old/" \
            --exclude ".venv/" \
            --exclude ".vscode/" \
            --exclude "scripts/" \
            --exclude ".config/" \
            --exclude ".githooks/" \
            --exclude "vendor/" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${PROD_PATH}/"

      - name: Post-deploy (PROD)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ env.DEPLOY_HOST_EFFECTIVE }}" << 'EOF'
            set -e
            cd "${{ secrets.PROD_PATH }}"

            if [ -f package.json ]; then
              npm ci
              npm run build
            fi

            if [ -f composer.json ]; then
              rm -rf vendor 2>/dev/null || true
              composer install --no-dev --optimize-autoloader
            fi

            sudo systemctl reload nginx 2>/dev/null || true
            sudo systemctl reload php8.2-fpm 2>/dev/null || true
            sudo systemctl reload php8.1-fpm 2>/dev/null || true
            sudo systemctl reload php8.0-fpm 2>/dev/null || true
          EOF
