name: Deploy PROD (main -> ios1vcrime.com.br)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ios1vcrime-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Validar sintaxe PHP antes do deploy
        run: git ls-files -z '*.php' | xargs -0 -r -n1 php -l

      - name: Verificar dependências antes do deploy
        run: |
          composer audit --locked --no-dev --no-interaction
          npm audit --omit=dev --audit-level=moderate

      - name: Preparar alvo SSH (host + usuário, trim + DNS)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: bash .github/scripts/deploy-ssh-target-prepare.sh

      - name: Preflight (secrets obrigatórios)
        env:
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_TARGET_PATH: ${{ secrets.PROD_PATH }}
        run: bash .github/scripts/deploy-preflight.sh

      - name: Conectar à produção pela VPN WireGuard
        env:
          WG_CLIENT_PRIVATE_KEY: ${{ secrets.WG_CLIENT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WG_CLIENT_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret WG_CLIENT_PRIVATE_KEY não configurado no environment production."
            exit 1
          fi
          if ! command -v wg >/dev/null 2>&1 || ! command -v wg-quick >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wireguard-tools
          fi

          tmp_config="${RUNNER_TEMP}/gha-rei169-wg.conf"
          config="/etc/wireguard/gha-rei169-wg.conf"
          umask 077
          cat > "$tmp_config" <<EOF
          [Interface]
          PrivateKey = ${WG_CLIENT_PRIVATE_KEY}
          Address = 10.222.231.3/32

          [Peer]
          PublicKey = 83ZQWbfYaFvwvemWMrnmRLO9V5tGfisfapOFFTBtgEs=
          AllowedIPs = 10.222.231.1/32
          Endpoint = 72.60.250.46:51820
          PersistentKeepalive = 25
          EOF
          unset WG_CLIENT_PRIVATE_KEY
          sudo -n install -d -m 700 /etc/wireguard
          if ! cat "$tmp_config" | sudo -n sh -c 'umask 077; cat > /etc/wireguard/gha-rei169-wg.conf'; then
            rm -f -- "$tmp_config"
            echo "::error::Não foi possível instalar a configuração WireGuard protegida."
            exit 1
          fi
          rm -f -- "$tmp_config"
          sudo -n chown root:root -- "$config"
          sudo -n chmod 600 -- "$config"
          if ! sudo -n wg-quick strip "$config" >/dev/null 2>&1; then
            echo "::error::Configuração WireGuard inválida; conteúdo omitido."
            exit 1
          fi
          printf 'DEPLOY_HOST_EFFECTIVE=10.222.231.1\n' >> "$GITHUB_ENV"

          sudo -n wg-quick up "$config"
          echo "Interface WireGuard configurada; a conectividade será validada pelo SSH com fingerprint fixada."

      - name: Setup SSH (decode + validar chave + keyscan)
        env:
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_KEY_B64 }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
          DEPLOY_HOST_KEY_SHA256: ${{ secrets.DEPLOY_HOST_KEY_SHA256 }}
        run: bash .github/scripts/deploy-ssh-setup.sh

      - name: SSH sanity check
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER_EFFECTIVE }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
        run: bash .github/scripts/deploy-ssh-check.sh

      - name: Verificar armazenamento do limite de login
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER_EFFECTIVE }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd \"${PROD_PATH}\" && php -r 'require \"app/helpers/Conection.php\"; Conection::getInstance()->getConnection()->query(\"SELECT scope_type, scope_value, attempt_count, lock_level, window_started_at, last_attempt_at, locked_until FROM login_rate_limits LIMIT 0\");'"

      - name: Garantir diretório destino (PROD)
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER_EFFECTIVE }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p \"${PROD_PATH}\" && echo \"Diretório OK: ${PROD_PATH}\""

      - name: Aplicar migration de cartas antes da publicação (PROD)
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER_EFFECTIVE }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
          DEPLOY_TARGET_PATH: ${{ secrets.PROD_PATH }}
        run: bash .github/scripts/deploy-staged-cartas-migration.sh

      - name: Sync files to server (PROD)
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER_EFFECTIVE }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          set -e
          # --checksum: o "quick check" (tamanho+mtime) pode saltar ficheiros com mesmo tamanho
          # e mtime parecido; garante que o conteúdo em disco no servidor acompanha o repositório.
          rsync -azc \
            --no-times --omit-dir-times \
            --no-perms --no-owner --no-group \
            --inplace \
            --mkpath \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "/tests/" \
            --exclude ".agents/" \
            --exclude ".cursor/" \
            --exclude "AGENTS.md" \
            --exclude ".env" \
            --exclude "gha_deploy_ed25519*" \
            --exclude "storage/" \
            --exclude "docs/" \
            --exclude "old/" \
            --exclude ".venv/" \
            --exclude ".vscode/" \
            --exclude ".config/" \
            --exclude ".githooks/" \
            --exclude "vendor/" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${PROD_PATH}/"

      - name: Post-deploy (PROD)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ env.DEPLOY_USER_EFFECTIVE }}@${{ env.DEPLOY_HOST_EFFECTIVE }}" << 'EOF'
            set -e
            cd "${{ secrets.PROD_PATH }}"

            # `.env` é deliberadamente excluído do rsync. Garanta a origem pública
            # canônica para links de recuperação sem tocar nas demais variáveis.
            if [ ! -f .env ]; then
              echo "Arquivo .env ausente no destino de produção." >&2
              exit 1
            fi
            pool_config="$(find /etc/php -type f -name 'ios1vcrime.com.br.conf' -print -quit 2>/dev/null)"
            web_user="$(awk -F= '/^[[:space:]]*user[[:space:]]*=/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' "$pool_config")"
            if [ -z "$web_user" ]; then
              echo "Usuário do pool PHP de ios1vcrime.com.br não encontrado." >&2
              exit 1
            fi
            if [ "$(stat -c '%u' .env)" != "$(id -u "$web_user")" ]; then
              sudo -n chown "$web_user" .env
            fi
            chmod 600 .env
            php -r '
              $path = ".env";
              $content = file_get_contents($path);
              if ($content === false) {
                fwrite(STDERR, "Não foi possível ler o .env de produção.\n");
                exit(1);
              }
              $line = "APP_URL=https://ios1vcrime.com.br";
              $updated = preg_match("/^APP_URL=.*/m", $content) === 1
                ? preg_replace("/^APP_URL=.*/m", $line, $content, 1)
                : rtrim($content, "\r\n") . PHP_EOL . $line . PHP_EOL;
              if ($updated === null || file_put_contents($path, $updated, LOCK_EX) === false) {
                fwrite(STDERR, "Não foi possível atualizar APP_URL no .env de produção.\n");
                exit(1);
              }
            '

            if [ -f package.json ]; then
              npm ci
              npm run build --if-present
            fi

            if [ -f composer.json ]; then
              vendor_stage=$(mktemp -d "${PWD}/.vendor-next.XXXXXXXX")
              vendor_backup="${vendor_stage}.previous"
              if ! COMPOSER_VENDOR_DIR="$vendor_stage" composer install --no-dev --optimize-autoloader --no-interaction; then
                rm -rf -- "$vendor_stage"
                echo "Falha ao preparar dependências; vendor atual preservado." >&2
                exit 1
              fi
              # mktemp cria o diretório com modo 700; o PHP do servidor web
              # precisa atravessá-lo e ler as bibliotecas após a troca.
              chmod -R a+rX -- "$vendor_stage"
              if ! php -r 'require $argv[1] . "/autoload.php"; if (!class_exists("Dompdf\\Dompdf")) { fwrite(STDERR, "Dompdf indisponivel no autoload.\n"); exit(1); }' "$vendor_stage"; then
                rm -rf -- "$vendor_stage"
                echo "Falha ao validar Dompdf; vendor atual preservado." >&2
                exit 1
              fi
              if [ -e vendor ]; then
                mv -- vendor "$vendor_backup"
              fi
              if ! mv -- "$vendor_stage" vendor; then
                if [ -e "$vendor_backup" ]; then mv -- "$vendor_backup" vendor; fi
                rm -rf -- "$vendor_stage"
                echo "Falha ao ativar dependências; restauração do vendor tentada." >&2
                exit 1
              fi
              rm -rf -- "$vendor_backup"
            fi

            if [ -f scripts/migrate-cejusc.php ]; then
              php scripts/migrate-cejusc.php
            fi

            # O rsync preserva arquivos removidos do repositório; retire apenas
            # os scripts e o agendamento da antiga automação de Tarefas.
            if command -v crontab >/dev/null 2>&1; then
              cron_atual=$(mktemp)
              if crontab -l > "$cron_atual" 2>/dev/null && grep -Fq '# ios1vcrime-cartorio-tarefas-automacao' "$cron_atual"; then
                sed '/# ios1vcrime-cartorio-tarefas-automacao/d' "$cron_atual" | crontab -
              fi
              rm -f "$cron_atual"
            fi
            rm -f scripts/migrate-cartorio-tarefas.php \
              scripts/migrate-cartorio-tarefas-automacao.php \
              scripts/install-cron-cartorio-tarefas-automacao.sh \
              scripts/agendar-cartorio-tarefas-automacao.sh \
              scripts/processar-cartorio-tarefas-automacao.php \
              scripts/check-cartorio-tarefas-automacao.php \
              scripts/purge-cartorio-tarefas.php
            rm -f app/views/internal/_fokuslaw-module-shell.php \
              app/views/internal/fokuslaw-tarefas.php \
              app/views/internal/fokuslaw-expedicoes.php \
              app/views/internal/cartorio-tarefas-list.php \
              app/views/internal/cartorio-tarefas-create.php \
              app/views/internal/cartorio-tarefas-rules.php \
              app/repositories/CartorioTarefasRepository.php \
              app/repositories/CartorioTarefasRegrasRepository.php \
              app/services/CartorioTarefasAutomacaoService.php \
              app/helpers/CartorioTarefasAutomacaoVersao.php \
              app/helpers/CartorioTarefasCondicoes.php \
              app/helpers/CartorioTarefasRegras.php \
              app/helpers/TarefasLocalHelper.php \
              database/migrations/20261104_create_fokuslaw_modules.sql \
              public/api/fokuslaw/expedicoes.php \
              public/assets/css/modules/fokuslaw/fokuslaw-module.css \
              public/assets/js/modules/fokuslaw/expedicoes.js \
              public/templates/fokuslaw-tarefas-lista.html \
              public/assets/css/cartorio-tarefas-regras.css \
              public/assets/js/cartorio-tarefas-regras.js

            if [ -f scripts/migrate-gabinete-reu-preso-controle-tipo.php ]; then
              php scripts/migrate-gabinete-reu-preso-controle-tipo.php
            fi

            if [ -f scripts/migrate-dashboard-conclusoes.php ]; then
              php scripts/migrate-dashboard-conclusoes.php
            fi

            bash scripts/install-cron-inactive-external-users.sh

            sudo systemctl reload nginx 2>/dev/null || true
            sudo systemctl reload php8.2-fpm 2>/dev/null || true
            sudo systemctl reload php8.1-fpm 2>/dev/null || true
            sudo systemctl reload php8.0-fpm 2>/dev/null || true

            # Registre o horário só depois que sincronização, migrations e tarefas
            # pós-deploy terminaram; uma falha anterior mantém o último deploy válido.
            site_deployed_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            SITE_DEPLOYED_AT="$site_deployed_at" php -r '
              $path = ".env";
              $timestamp = getenv("SITE_DEPLOYED_AT");
              if (!is_string($timestamp) || preg_match("/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$/D", $timestamp) !== 1) {
                fwrite(STDERR, "Timestamp de deploy ausente ou inválido.\n");
                exit(1);
              }
              $content = file_get_contents($path);
              if ($content === false) {
                fwrite(STDERR, "Não foi possível ler o .env ao registrar o deploy.\n");
                exit(1);
              }
              $line = "SITE_DEPLOYED_AT=" . $timestamp;
              $updated = preg_match("/^SITE_DEPLOYED_AT=.*/m", $content) === 1
                ? preg_replace("/^SITE_DEPLOYED_AT=.*/m", $line, $content, 1)
                : rtrim($content, "\r\n") . PHP_EOL . $line . PHP_EOL;
              if ($updated === null || file_put_contents($path, $updated, LOCK_EX) === false) {
                fwrite(STDERR, "Não foi possível registrar SITE_DEPLOYED_AT no .env.\n");
                exit(1);
              }
            '
          EOF

      - name: Remover túnel WireGuard do runner
        if: always()
        run: |
          tmp_config="${RUNNER_TEMP}/gha-rei169-wg.conf"
          config="/etc/wireguard/gha-rei169-wg.conf"
          sudo -n wg-quick down "$config" >/dev/null 2>&1 || true
          sudo -n rm -f -- "$config" >/dev/null 2>&1 || true
          rm -f -- "$tmp_config"
