name: Deploy DEV (manual -> dev.ios1vcrime.com.br)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Preparar alvo SSH (host + usuário, trim + DNS)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: bash .github/scripts/deploy-ssh-target-prepare.sh

      - name: Preflight (secrets obrigatórios)
        env:
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_TARGET_PATH: ${{ secrets.DEV_PATH }}
        run: bash .github/scripts/deploy-preflight.sh

      - name: Setup SSH (decode + validar chave + keyscan)
        env:
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_KEY_B64 }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
          DEPLOY_HOST_KEY_SHA256: ${{ secrets.DEPLOY_HOST_KEY_SHA256 }}
        run: bash .github/scripts/deploy-ssh-setup.sh

      - name: SSH sanity check
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER_EFFECTIVE }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
        run: bash .github/scripts/deploy-ssh-check.sh


      - name: Garantir diretório destino (DEV)
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER_EFFECTIVE }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
          DEV_PATH: ${{ secrets.DEV_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p \"${DEV_PATH}\" && echo \"Diretório OK: ${DEV_PATH}\""

      - name: Aplicar migration de cartas antes da publicação (DEV)
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER_EFFECTIVE }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
          DEPLOY_TARGET_PATH: ${{ secrets.DEV_PATH }}
        run: bash .github/scripts/deploy-staged-cartas-migration.sh

      # Em caso de permissão negada, siga o diagnóstico pontual em DEPLOY-SETUP.md.
      - name: Sync files to server (DEV)
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER_EFFECTIVE }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST_EFFECTIVE }}
          DEV_PATH: ${{ secrets.DEV_PATH }}
        run: |
          set -e
          # --checksum: evita rsync a ignorar ficheiros quando tamanho+mtime coincidem mas o conteúdo mudou.
          rsync -azc \
            --no-times --omit-dir-times \
            --no-perms --no-owner --no-group \
            --inplace \
            --mkpath \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".agents/" \
            --exclude ".cursor/" \
            --exclude "AGENTS.md" \
            --exclude ".env" \
            --exclude "gha_deploy_ed25519*" \
            --exclude "storage/" \
            --exclude "docs/" \
            --exclude "old/" \
            --exclude ".venv/" \
            --exclude ".vscode/" \
            --exclude ".config/" \
            --exclude ".githooks/" \
            --exclude "vendor/" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEV_PATH}/"

      - name: Post-deploy (DEV)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ env.DEPLOY_USER_EFFECTIVE }}@${{ env.DEPLOY_HOST_EFFECTIVE }}" << 'EOF'
            set -e
            cd "${{ secrets.DEV_PATH }}"

            if [ -f package.json ]; then
              npm ci
              npm run build --if-present
            fi

            if [ -f composer.json ]; then
              rm -rf vendor 2>/dev/null || true
              composer install --no-dev --optimize-autoloader
            fi

            sudo systemctl reload nginx 2>/dev/null || true
            sudo systemctl reload php8.2-fpm 2>/dev/null || true
            sudo systemctl reload php8.1-fpm 2>/dev/null || true
            sudo systemctl reload php8.0-fpm 2>/dev/null || true
          EOF
