name: Pauta REI69 — MySQL isolado
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pauta-mysql:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lower_case_table_names: [0, 1]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Obter imagens por digest
        run: |
          docker pull php@sha256:64ffb7411253121bbeb0d9eba37ce85e88d2a60d698e5debbd66bac71b20f3c2
          docker pull composer@sha256:511d2a96fce74de098b54224d59146fb8b6a7735d4e301f16c87c062e511900d
          docker pull mysql@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
      - name: Construir runtime sem rede
        run: docker build --network none --pull=false --iidfile "$RUNNER_TEMP/rei69-pauta-qa.id" tests/auth/ci-runtime
      - name: Verificar contrato de metadados sem banco
        run: php tests/rei69-pauta/migration-preflight-contract.test.php
      - name: Exercitar vínculos em MySQL descartável
        shell: pwsh
        run: |
          $image = (Get-Content -LiteralPath "$env:RUNNER_TEMP/rei69-pauta-qa.id" -Raw).Trim()
          ./tests/rei69-pauta/run-rei69-pauta-mysql-ci.ps1 -CiLinux -QaImageId $image -LowerCaseTableNames ${{ matrix.lower_case_table_names }}
      - name: Verificar resíduos identificados
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          containers=$(docker ps -aq --filter label=com.fokus.rei69pauta-pauta-test)
          volumes=$(docker volume ls -q --filter label=com.fokus.rei69pauta-pauta-test)
          test -z "$containers"
          test -z "$volumes"
