name: Teste de interação Cartas Expedidas

on:
  pull_request:
    branches: [main]
    paths:
      - public/assets/js/shared/cartorio-cartas-expedidas-create.js
      - tests/cartas/create-double-click.test.js
      - .github/workflows/cartas-expedidas-interaction.yml

concurrency:
  group: cartas-interaction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cartas-expedidas-interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Teste de bloqueio e revalidação do formulário
        run: node tests/cartas/create-double-click.test.js
