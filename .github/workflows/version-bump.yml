name: Auto Version Bump

on:
  push:
    branches:
      - develop

jobs:
  bump-version:
    if: >
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip version]') &&
      !contains(github.event.head_commit.message, '[skip-version]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Skip if VERSION already changed in commit
        id: version_check
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q "^VERSION$"; then
            echo "VERSION already updated in commit. Skipping bump."
            echo "skip_bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump VERSION
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        if: steps.version_check.outputs.skip_bump != 'true'
        run: |
          printf '%s' "$COMMIT_MESSAGE" > .commit_msg.txt
          pwsh scripts/bump-version.ps1 -CommitMessagePath .commit_msg.txt
          rm -f .commit_msg.txt

      - name: Commit and push
        if: steps.version_check.outputs.skip_bump != 'true'
        run: |
          if [ ! -f VERSION ] || [ ! -f CHANGELOG.md ]; then
            echo "VERSION or CHANGELOG.md missing; refusing partial version commit." >&2
            exit 1
          fi

          git add -- VERSION CHANGELOG.md
          if git diff --cached --quiet -- VERSION CHANGELOG.md; then
            echo "No version artifacts changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          git commit -m "chore(version): ${VERSION_VALUE} [skip version]" -- VERSION CHANGELOG.md
          git push
