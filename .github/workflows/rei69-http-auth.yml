name: REI69 HTTP autenticado isolado
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rei69-http:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Obter imagens por digest
        run: |
          docker pull php@sha256:64ffb7411253121bbeb0d9eba37ce85e88d2a60d698e5debbd66bac71b20f3c2
          docker pull composer@sha256:511d2a96fce74de098b54224d59146fb8b6a7735d4e301f16c87c062e511900d
          docker pull composer@sha256:5248900ab8b5f7f880c2d62180e40960cd87f60149ec9a1abfd62ac72a02577c
          docker pull mysql@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
          docker pull axllent/mailpit@sha256:df6c2541907e1be6fac21f509927cf6ed771617a1f4b361ef66d97bd05593d2d
      - name: Construir runtime sem rede
        run: docker build --network none --pull=false --iidfile "$RUNNER_TEMP/rei69-auth-qa.id" tests/auth/ci-runtime
      - name: Instalar dependências fixadas sem scripts ou plugins
        run: |
          python3 -B tests/auth/rei124-check-composer-inputs.test.py
          python3 -B tests/auth/rei124-check-composer-inputs.py
          docker run --rm --label fokus.auth-e2e=rei69-ci-prep --network bridge \
            --mount "type=bind,source=$PWD/composer.json,target=/workspace/composer.json,readonly" \
            --mount "type=bind,source=$PWD/composer.lock,target=/workspace/composer.lock,readonly" \
            --mount "type=bind,source=$PWD/vendor,target=/workspace/vendor" --workdir /workspace \
            composer@sha256:5248900ab8b5f7f880c2d62180e40960cd87f60149ec9a1abfd62ac72a02577c \
            install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress --optimize-autoloader
          docker run --rm --label fokus.auth-e2e=rei69-ci-prep --network none \
            --mount "type=bind,source=$PWD/composer.json,target=/workspace/composer.json,readonly" \
            --mount "type=bind,source=$PWD/composer.lock,target=/workspace/composer.lock,readonly" \
            --mount "type=bind,source=$PWD/vendor,target=/workspace/vendor,readonly" --workdir /workspace \
            "$(cat "$RUNNER_TEMP/rei69-auth-qa.id")" composer check-platform-reqs --no-dev
      - name: Exercitar login e endpoints em sandbox
        shell: pwsh
        run: |
          $image = (Get-Content -LiteralPath "$env:RUNNER_TEMP/rei69-auth-qa.id" -Raw).Trim()
          ./tests/auth/run-isolated-auth-e2e.ps1 -QaImageId $image -Rei69Http
      - name: Verificar resíduos do sandbox
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          containers=$(docker ps -aq --filter label=fokus.auth-e2e)
          networks=$(docker network ls -q --filter label=fokus.auth-e2e)
          volumes=$(docker volume ls -q --filter label=fokus.auth-e2e)
          test -z "$containers"
          test -z "$networks"
          test -z "$volumes"
