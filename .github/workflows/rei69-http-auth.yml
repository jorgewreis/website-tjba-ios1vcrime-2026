name: REI69 HTTP — recusa sem chave no PR
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rei69-http-refusal:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Confirmar recusa sem chave antes de Docker
        run: python3 -B tests/auth/rei93-daemon-refusal.test.py
