name: Verificação de Sintaxe PHP
on:
  # Pushes nas branches principais são validados diretamente. Branches com PR
  # rodam somente no evento pull_request, evitando dois workflows por commit.
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: php-syntax-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite
      - name: Verificar Sintaxe
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Testar listagem unificada de usuários com perfis mistos
        run: php tests/usuarios/rei148-perfis-mistos.test.php
