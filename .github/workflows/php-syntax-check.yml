name: Verificação de Sintaxe PHP
on: [push, pull_request]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, iconv, mbstring, pdo_mysql, pdo_sqlite, simplexml
      - name: Verificar Sintaxe
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Validar manifesto e lock do Composer
        run: composer validate --no-check-publish
      - name: Validar plataforma real contra o lock
        run: composer check-platform-reqs --lock --no-dev
      - name: Simular instalação sem gravar dependências
        run: composer install --dry-run --no-dev --no-interaction --no-progress --no-scripts --no-plugins
      - name: Testar listagem unificada de usuários com perfis mistos
        run: php tests/usuarios/rei148-perfis-mistos.test.php
      - name: Verificar acesso sintético a instituições e vínculos
        run: |
          python3 -B tests/instituicoes-publicas/http-boundary-audit.test.py
          python3 -B tests/instituicoes-publicas/rei337-export-guard-http.test.py
          python3 -B tests/instituicoes-publicas/consultor-http-isolado.test.py
          python3 -B tests/processos-partes/lista-isolada.test.py
