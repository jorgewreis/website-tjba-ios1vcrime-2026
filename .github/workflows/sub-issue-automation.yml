name: Automação de Sub-issues (Hierarquia)
on:
  issues:
    types: [labeled, closed]

jobs:
  sync-parent-child:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Sincronizar Pai e Sub-issues
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const LABEL_IN_PROGRESS = 'Em progresso';

            // Query GraphQL para buscar o Pai e os irmãos (outras sub-issues)
            const query = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) {
                  id
                  parent {
                    id
                    number
                    state
                    subIssues(first: 50) {
                      nodes {
                        number
                        state
                      }
                    }
                  }
                }
              }
            }`;

            const result = await github.graphql(query, { owner, repo, number: issueNumber });
            const parentIssue = result.repository.issue.parent;

            // Se não tiver pai, encerra o script
            if (!parentIssue) {
              console.log('Esta issue não possui um elemento pai. Nenhuma ação necessária.');
              return;
            }

            console.log(`Elemento Pai encontrado: #${parentIssue.number}`);

            // --- CENÁRIO 1: Mover Pai para "Em progresso" ---
            if (context.payload.action === 'labeled' && context.payload.label.name === LABEL_IN_PROGRESS) {
              if (parentIssue.state === 'OPEN') {
                console.log(`Aplicando label '${LABEL_IN_PROGRESS}' ao Pai #${parentIssue.number}`);
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: parentIssue.number,
                  labels: [LABEL_IN_PROGRESS]
                });
              }
            }

            // --- CENÁRIO 2: Concluir Pai se todas as sub-issues estiverem fechadas ---
            if (context.payload.action === 'closed') {
              const subIssues = parentIssue.subIssues.nodes;

              // Verifica se existe alguma sub-issue que AINDA está aberta
              // (A issue atual já consta como CLOSED no payload, mas verificamos o array retornado)
              const hasOpenSubIssues = subIssues.some(sub => sub.state === 'OPEN');

              if (!hasOpenSubIssues) {
                console.log(`Todas as sub-issues do Pai #${parentIssue.number} estão fechadas.`);
                console.log(`Fechando a Issue Pai #${parentIssue.number}...`);

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: parentIssue.number,
                  state: 'closed'
                });

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: parentIssue.number,
                  body: 'Todas as sub-issues foram concluídas. Encerrando este item automaticamente.'
                });
              } else {
                console.log(`O Pai #${parentIssue.number} ainda possui sub-issues abertas.`);
              }
            }
