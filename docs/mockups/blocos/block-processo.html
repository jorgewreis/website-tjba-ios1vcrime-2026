<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- STYLES -->
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');
    </style>

    <!-- STYLES -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "JetBrains Mono", monospace;
            padding: 10px;
        }

        .tooltip {
            position: relative;
            cursor: pointer;
        }

        .tooltip::after {
            content: attr(data-title);
            position: absolute;

            left: 50%;
            bottom: calc(100% + 8px);
            transform: translateX(-50%);

            background-color: #111827;
            color: #ffffff;

            padding: 6px 10px;
            border-radius: 6px;

            font-size: 10px;
            font-weight: 500;
            line-height: 1.3;

            white-space: nowrap;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 999;
        }

        .tooltip:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-2px);
        }

        .container-processo {
            width: 300px;
            height: 55px;

            margin: 0;
            padding: 0;

            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            align-items: flex-start;
            justify-content: flex-start;

            border-radius: 6px;
            border: 1px solid #e5e7eb;
        }

        .main-processo {
            position: relative;
            width: 100%;

            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
        }

            .main-processo .left {
                width: 100%;

                display: flex;
                flex-direction: column;
                flex-wrap: nowrap;
                align-items: center;
                justify-content: flex-start;

                padding: 3px 10px;
                box-sizing: border-box;
            }
        
            .main-processo .left .numero{
                width: 100%;

                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                align-items: center;    
                justify-content: flex-start;
                font-size: 13px;
                font-weight: 700;
                color: #202020;
            }

            .main-processo .right .prioridades {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                align-items: center;
                justify-content: flex-end;

                margin-right: 5px;
            }
                .main-processo .right .prioridades .btn-micro {
                    width: 20px;
                    height: 20px;

                    display: flex;
                    flex-direction: row;
                    flex-wrap: nowrap;
                    align-items: center;
                    justify-content: center;

                    cursor: pointer;
                }

                    .main-processo .right .prioridades .btn-micro .btn-micro-icon {
                        width: 14px;
                        height: 14px;
                    }

        .footer-processo {
            width: 100%;
            height: 30px;

            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
            
            border-top: 1px solid #eee;
        }

            .footer-processo .left {
                max-width: 220px;
                width: fit-content;
                height: 100%;

                display: flex;
                flex-direction: column;
                flex-wrap: nowrap;
                align-items: flex-start;
                justify-content: flex-start;

                padding: 3px 10px;
                box-sizing: border-box;
            }

                .footer-processo .left .processo-classe {
                    max-width: 220px;

                    display: flex;
                    flex-direction: row;
                    flex-wrap: nowrap;
                    align-items: center;
                    justify-content: flex-start;

                    overflow: hidden;
                    text-overflow: ellipsis;
                    white-space: nowrap;

                    font-size: 10px;
                    font-weight: 500;
                    color: #696cff;
                }
                    .footer-processo .left .processo-classe.not {
                        color: #909090;
                    }

                .footer-processo .left .processo-assunto {
                    max-width: 220px;

                    display: flex;
                    flex-direction: row;
                    flex-wrap: nowrap;
                    align-items: center;
                    justify-content: flex-start;

                    overflow: hidden;
                    text-overflow: ellipsis;
                    white-space: nowrap;

                    font-size: 9px;
                    font-weight: 400;
                    color: #34368D;
                }
                    .footer-processo .left .processo-assunto.not {
                        color: #909090;
                    }

            .footer-processo .right {
                width: 60px;
                height: 100%;

                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                align-items: center;
                justify-content: flex-end;
            }
                
                .main-processo .right {
                    position: absolute;
                    top: 0;
                    right: 0;
                    width: fit-content;

                    display: flex;
                    flex-direction: row;
                    flex-wrap: nowrap;
                    align-items: center;
                    justify-content: flex-end;
                }

                .footer-processo .right .buttons {
                    display: flex;
                    flex-direction: row;
                    flex-wrap: nowrap;
                    align-items: center;
                    justify-content: center;
                }

                    .footer-processo .right .buttons .btn-mini {
                        width: 30px;
                        height: 30px;

                        display: flex;
                        flex-direction: row;
                        flex-wrap: nowrap;
                        align-items: center;
                        justify-content: center;

                        cursor: pointer;
                    }

                        .btn-mini .btn-mini-icon {
                            width: 20px;
                            height: 20px;

                            filter: grayscale(100%);
                            opacity: 0.3;
                            transition: filter 0.3s ease, opacity 0.3s ease;
                        }
                            .btn-mini:hover .btn-mini-icon{
                                filter: grayscale(0%);
                                opacity: 1;
                                transition: filter 0.3s ease, opacity 0.3s ease;
                            }
    </style>
</head>
<body>

    <!-- CONTAINER PROCESSO COMPLETO -->
    <div class="container-processo">
        <!-- CONTENT -->
        <div class="main-processo">
            <!-- LEFT - NUMERO -->
            <div class="left">
                <div class="numero">0000000-00.0000.0.00.0000</div>
            </div>

            <!-- RIGHT - PRIORIDADES -->
            <div class="right">
                <div class="prioridades">
                    <div class="btn-micro tooltip" data-title="Processo Sigiloso">
                        <img class="btn-micro-icon" src="./../../../public/assets/icons/Lock-6--Streamline-Ultimate.png">
                    </div>
                    <div class="btn-micro tooltip" data-title="Réu Preso">
                        <img class="btn-micro-icon" src="./../../../public/assets/icons/Crime-Man-Inmate--Streamline-Ultimate.png">
                    </div>
                    <div class="btn-micro tooltip" data-title="Violência Doméstica, Criança ou Adolescente">
                        <img class="btn-micro-icon" src="./../../../public/assets/icons/Police-Rotating-Light-1--Streamline-Ultimate.png">
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer-processo">
            <!-- LEFT - CLASSE + ASSUNTOS -->
            <div class="left">
                <div class="processo-classe">283 - Ação Penal - Procedimento Ordinário</div>
                <div class="processo-assunto">Ameaça | Vias de Fato | Grave</div>
            </div>

            <!-- RIGHT - BUTTONS -->
            <div class="right">
                <div class="buttons">
                    <div class="btn-mini tooltip" data-title="Abrir processo">
                        <img class="btn-mini-icon" src="./../../../public/assets/icons/Resize-Expand-Corner--Streamline-Ultimate.png">
                    </div>
                    <div class="btn-mini tooltip" data-title="Copiar número do processo">
                        <img class="btn-mini-icon" src="./../../../public/assets/icons/Task-Checklist--Streamline-Ultimate.png">
                    </div>
                </div>
            </div>
        </div>
    </div><br>

            <!-- RIGHT - BUTTONS -->

     <div class="container-processo">
        <!-- CONTENT -->

            </div>

            <!-- RIGHT - PRIORIDADES -->
            <div class="right">

        <!-- FOOTER -->

            <!-- RIGHT - BUTTONS -->
            <div class="right">

                    <div class="btn-mini tooltip" data-title="Abrir processo">

                    <div class="btn-mini tooltip" data-title="Copiar número do processo">
                        <img class="btn-mini-icon" src="./../../../public/assets/icons/Task-Checklist--Streamline-Ultimate.png">

</body>
</html>
